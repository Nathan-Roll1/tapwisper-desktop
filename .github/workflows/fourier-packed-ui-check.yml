name: Verify compiled TapWisper Fourier AppImage
on:
  push:
    branches: [qa/fourier-verify-compiled-appimage]
permissions:
  actions: read
  contents: read
jobs:
  packaged-picker-mic-paste:
    if: github.repository == 'Nathan-Roll1/tapwisper-desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: build-only-preview-candidate
          run-id: 45078138863
          github-token: ${{ github.token }}
          path: /tmp/tap-preview-out
      - name: Run the exact AppImage payload on an X11 desktop
        env:
          TAP_PACKAGED_APP: /tmp/squashfs-root/AppRun
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool ffmpeg openbox pulseaudio pulseaudio-utils python3-gi gir1.2-gtk-3.0 > /tmp/tap-apt.log
          cd /tmp/tap-preview-out
          echo '0a658e2104d04501fe1125e4ccfef29d3477df5e51cfb2e9f06ac57c046b45e2  TapWisper-Fourier-preview-linux-x86_64.AppImage' | sha256sum -c
          chmod +x TapWisper-Fourier-preview-linux-x86_64.AppImage
          (cd /tmp && /tmp/tap-preview-out/TapWisper-Fourier-preview-linux-x86_64.AppImage --appimage-extract >/dev/null)
          sudo chown root:root /tmp/squashfs-root/chrome-sandbox
          sudo chmod 4755 /tmp/squashfs-root/chrome-sandbox
          cd "$GITHUB_WORKSPACE"
          npm install --prefix /tmp/tap-cdp --no-audit --no-fund playwright-core@1.55.0
          curl -fsSL https://raw.githubusercontent.com/ggml-org/whisper.cpp/b0a11594aec50892a02cd8d129eee2dfe93a8bb8/samples/jfk.wav -o /tmp/tap-fixture.wav
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x900x24" bash qa-preview/run.sh
      - name: Save the validated preview
        uses: actions/upload-artifact@v4
        with:
          name: TapWisper-Fourier-preview-linux-x86_64
          path: /tmp/tap-preview-out/
          compression-level: 0
      - name: Save the recorded editor output and settings screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-dictation-evidence
          path: |
            /tmp/tap-picker.png
            /tmp/tap-inserted.txt
            /tmp/tap-events.log
            /tmp/tap-app.log
            /tmp/tap-preview-out/SHA256SUMS
